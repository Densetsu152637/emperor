[project]
name = "emperor"
version = "0.0.0"
description = "Training, evaluation, and export for Emperor, an open-weight delegation model for Imperium"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
eval = "emperor.dispatch:eval_main"
data = "emperor.dispatch:data_main"
train = "emperor.train.cli:main"
pipeline = "emperor.dispatch:pipeline_main"
hosted = "emperor.dispatch:hosted_main"
release = "emperor.release.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
# Synthetic data generation against a local llama-server (`uv run --group data data ...`).
data = ["httpx>=0.27"]
# Hosted teacher, simulator and judge (`uv run --group data --group hosted hosted ...`): API
# keys come from the OS credential store through keyring.
hosted = ["keyring>=25"]
# Uploading to the Hugging Face Hub (`uv run --group publish release publish --confirm ...`).
publish = ["huggingface_hub>=0.30"]
# bf16 LoRA fine-tuning and merging. The torch wheel comes from the CUDA 12.8 index because
# Blackwell cards (RTX 50 series) need cu128 or newer. Not synced by default: it is multi-GB.
train = [
    "torch>=2.8",
    "transformers>=4.56",
    "peft>=0.17",
    "trl>=1.0",
    "datasets>=4.0",
    "accelerate>=1.10",
    "safetensors>=0.5",
    # Qwen3.5's Gated DeltaNet layers: Triton kernels instead of the reference PyTorch loop
    # (3x faster steps, 1.6 GiB less peak VRAM at 6144 tokens on the RTX 5080). On Windows,
    # Triton comes from triton-windows, which bundles its own C compiler (TinyCC).
    "flash-linear-attention>=0.6",
    "triton-windows>=3.9,<3.10; sys_platform == 'win32'",
    # llama.cpp's convert_hf_to_gguf.py (GGUF export) imports these.
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[tool.uv]
# The light groups the tests use; train and publish stay opt-in.
default-groups = ["dev", "data", "hosted"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/emperor/data/prompts.py" = ["E501"]  # template and vocabulary tables

[tool.pytest.ini_options]
testpaths = ["tests"]
